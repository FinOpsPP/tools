[build-system]
requires = ["setuptools>=80.9.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "finopspp"
version = "0.3.0"
description = "CLI tool used for the FinOps++ Assessment."
readme = "README.md"
requires-python = ">=3.13"
authors = [{ name = "Travis Salas Cox" }]
dependencies = [
    "click == 8.2.1",
    "click-didyoumean == 0.3.1",
    "click-help-colors == 0.9.4",
    "GitPython == 3.1.62",
    "jinja2 == 3.1.6",
    "pandas == 2.3.2",
    "pydantic == 2.12.0",
    "pyyaml == 6.0.2",
    "rich == 14.2.0",
    "semver == 3.0.4",
    "textual == 8.2.3",
    "xlsxwriter == 3.2.5"
]

[project.optional-dependencies]
validation = [
    "pylint == 4.0.3"
]
testing = [
    "pytest == 9.0.1"
]

[project.scripts]
finopspp = "finopspp.__main__:cli"

[tool.setuptools]
packages = [
    "finopspp",
    "finopspp.commands",
    "finopspp.commands.generate",
    "finopspp.commands.generate.composers",
    "finopspp.commands.info",
    "finopspp.commands.init",
    "finopspp.commands.inventory",
    "finopspp.commands.specifications",
    "finopspp.commands.variables",
    "finopspp.models",
    "finopspp.templates"
]

[tool.setuptools.package-data]
"finopspp.templates" = ["*.j2"]
